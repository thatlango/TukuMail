[package]
name = "tukumail-desktop"
version = "0.1.0"
description = "TukuMail desktop client"
authors = ["Tuku-Tuku Innovation Labs"]
edition = "2021"

[lib]
name = "tukumail_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
