[package]
name = "tuku-engine-v2"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "Tuku-owned mail engine: mailbox state, SMTP/IMAP protocol surfaces and durable delivery queue"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
mail-auth = { version = "0.13", default-features = false, features = ["rust-crypto", "dns-hickory"] }
mailparse = "0.17"
rustls-pemfile = "2"
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
pretty_assertions = "1"
